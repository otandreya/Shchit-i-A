<!DOCTYPE html>
<html lang="ru" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ООО «Щит и А» — Охранные услуги в Улан-Удэ и Бурятии | Пультовая охрана, ГБР, монтаж сигнализации</title>
    <meta name="description" content="Профессиональные охранные услуги в Улан-Удэ и Заиграевском районе Республики Бурятия. Сдать дом, квартиру или бизнес под охрану, смонтировать охранно-пожарную сигнализацию и видеонаблюдение, тревожная кнопка ГБР 24/7. ООО «Щит и А».">
    <meta name="keywords" content="охрана Улан-Удэ, охранные услуги Бурятия, пультовая охрана Улан-Удэ, смонтировать охрану, сдать дом под охрану, монтаж охранной сигнализации, тревожная кнопка ГБР, физическая охрана, охрана домов Заиграевский район, ООО Щит и А">
    <meta name="geo.region" content="RU-BU">
    <meta name="geo.placename" content="Улан-Удэ, Республика Бурятия">

    <script src="js/lucide.min.js"></script>
    <link rel="stylesheet" href="css/style.css">

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "LocalBusiness",
      "name": "ООО «Щит и А»",
      "description": "Охранные услуги в Улан-Удэ и Республике Бурятия: пультовая охрана, ГБР, физическая охрана, монтаж охранно-пожарной сигнализации и видеонаблюдения.",
      "areaServed": ["Улан-Удэ", "Заиграевский район", "Республика Бурятия"],
      "address": {
        "@type": "PostalAddress",
        "addressRegion": "Республика Бурятия",
        "addressLocality": "Улан-Удэ"
      },
      "telephone": "+7 (3012) 00-00-00"
    }
    </script>
</head>
<body class="bg-cyber-grid">
    <slot-header></slot-header>
    <slot-hero></slot-hero>
    <slot-services></slot-services>
    <slot-calculator></slot-calculator>
    <slot-contact></slot-contact>
    <slot-footer></slot-footer>

    <script>
        const revealObserver = new IntersectionObserver((entries) => {
            entries.forEach((entry) => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('is-visible');
                } else {
                    entry.target.classList.remove('is-visible');
                }
            });
        }, { threshold: 0.08, rootMargin: '0px 0px -60px 0px' });

        function attachReveal(root = document) {
            root.querySelectorAll('section, .glass-card').forEach((el, index) => {
                if (el.dataset.revealBound || el.closest('slot-header') || el.closest('slot-hero')) return;
                el.dataset.revealBound = '1';
                el.classList.add('reveal-up');
                if (el.classList.contains('glass-card')) {
                    el.style.transitionDelay = `${(index % 3) * 120}ms`;
                }
                revealObserver.observe(el);
            });
        }

        new MutationObserver(() => attachReveal()).observe(document.body, { childList: true, subtree: true });

        async function loadBlocks() {
            const slots = ['header', 'hero', 'services', 'calculator', 'contact', 'footer'];
            for (const slot of slots) {
                try {
                    const response = await fetch(`blocks/${slot}.html`);
                    if (response.ok) {
                        const content = await response.text();
                        const slotElement = document.querySelector(`slot-${slot}`);
                        slotElement.innerHTML = content;
                        
                        const oldScripts = slotElement.querySelectorAll('script');
                        for (const oldScript of oldScripts) {
                            const newScript = document.createElement('script');
                            if (oldScript.src) {
                                newScript.src = oldScript.src;
                            } else {
                                newScript.textContent = oldScript.textContent;
                            }
                            document.head.appendChild(newScript);
                        }
                    }
                } catch (error) {
                    console.error(`Ошибка загрузки блока ${slot}:`, error);
                }
            }
            if (window.lucide) {
                lucide.createIcons();
            }
            attachReveal();
        }

        loadBlocks();

        function updateSpotlight(clientX, clientY, tiltStrength = 10, scaleVal = 1.02) {
            document.querySelectorAll('.glass-card').forEach((card) => {
                const rect = card.getBoundingClientRect();
                const x = clientX - rect.left;
                const y = clientY - rect.top;
                card.style.setProperty('--x', `${x}px`);
                card.style.setProperty('--y', `${y}px`);
                if (x >= 0 && x <= rect.width && y >= 0 && y <= rect.height) {
                    const rotateX = ((y / rect.height) - 0.5) * -tiltStrength;
                    const rotateY = ((x / rect.width) - 0.5) * tiltStrength;
                    card.style.transform = `perspective(900px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(${scaleVal})`;
                } else {
                    card.style.transform = '';
                }
            });
        }

        document.addEventListener('mousemove', (e) => {
            updateSpotlight(e.clientX, e.clientY, 10, 1.02);
        });

        document.addEventListener('touchstart', (e) => {
            if (e.touches[0]) {
                updateSpotlight(e.touches[0].clientX, e.touches[0].clientY, 8, 1.01);
            }
        }, { passive: true });

        document.addEventListener('touchmove', (e) => {
            if (e.touches[0]) {
                updateSpotlight(e.touches[0].clientX, e.touches[0].clientY, 8, 1.01);
            }
        }, { passive: true });

        document.addEventListener('touchend', () => {
            document.querySelectorAll('.glass-card').forEach((card) => {
                card.style.transform = '';
            });
        });
    </script>
</body>
</html>
